# DW-017 · Auditoría semanal con Claude (usa la API de Anthropic: TIENE COSTO).
# APAGADA POR DEFECTO. Solo se ejecuta si la dirección:
#   1) guarda el secreto ANTHROPIC_API_KEY en el repositorio, y
#   2) crea la variable AUDITORIA_IA_ACTIVA con el valor true.
# Guía completa, costo estimado y cómo apagarla: docs/operations/AUTOMATIZACION.md
#
# Límites: tope de ejecuciones por mes (AUDITORIA_IA_MAX_MES, por defecto 5), máximo de
# turnos del agente, 30 minutos por ejecución y una sola ejecución a la vez.
# Claude solo lee el sitio y el repositorio y escribe en management/. No tiene terminal,
# no toca el sitio ni main: el flujo crea una rama y abre un PR para que la dirección lo revise.
name: Auditoría semanal con IA

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes, 7:00 a. m. hora de Bogotá
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: auditoria-semanal
  cancel-in-progress: false

jobs:
  auditoria:
    if: vars.AUDITORIA_IA_ACTIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODELO: ${{ vars.AUDITORIA_IA_MODELO || 'claude-sonnet-5-5' }}
      MAX_MES: ${{ vars.AUDITORIA_IA_MAX_MES || '5' }}
      MAX_TURNOS: ${{ vars.AUDITORIA_IA_MAX_TURNOS || '25' }}
    steps:
      - name: Comprobar clave y tope mensual
        id: guarda
        env:
          GH_TOKEN: ${{ github.token }}
          TIENE_CLAVE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$TIENE_CLAVE" != "true" ]; then
            echo "Falta el secreto ANTHROPIC_API_KEY: no se ejecuta nada ni se gasta nada." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "seguir=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          desde=$(date -u +%Y-%m-01)
          # Cuenta toda ejecución terminada este mes (también canceladas o agotadas por tiempo).
          hechas=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/auditoria-semanal.yml/runs?created=>=${desde}&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.conclusion != null and .conclusion != \"skipped\")] | length")
          echo "Ejecuciones este mes: ${hechas} de ${MAX_MES}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$hechas" -ge "$MAX_MES" ]; then
            echo "Tope mensual alcanzado: no se ejecuta." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "seguir=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "seguir=true" >> "$GITHUB_OUTPUT"
          echo "fecha=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guarda.outputs.seguir == 'true'
        with:
          persist-credentials: false   # el token de GitHub no queda en .git/config al alcance del agente

      - name: Chequeo de salud previo (gratis)
        if: steps.guarda.outputs.seguir == 'true'
        continue-on-error: true
        run: python3 scripts/monitor/salud_sitio.py --informe /tmp/salud.md

      # Permisos del agente: sin terminal; lectura del repositorio (por defecto) y de /tmp/salud.md;
      # escritura solo en management/audit-reports/ e IMPROVEMENT_BACKLOG.md; web solo domiwebb.com.
      - name: Auditoría con Claude
        if: steps.guarda.outputs.seguir == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model ${{ env.MODELO }}
            --max-turns ${{ env.MAX_TURNOS }}
            --allowedTools "Read(//tmp/salud.md),WebFetch(domain:domiwebb.com),Write(management/audit-reports/**),Edit(management/audit-reports/**),Edit(management/IMPROVEMENT_BACKLOG.md)"
            --disallowedTools "Bash,Read(//proc/**),Read(//home/runner/**),Read(.git/**)"
          prompt: |
            Actúa como DOMIWEBB AI DIRECTOR (lee CLAUDE.md) en una auditoría semanal de solo lectura.
            Hoy es ${{ steps.guarda.outputs.fecha }}.
            1. Lee /tmp/salud.md (chequeo de salud de hoy), management/IMPROVEMENT_BACKLOG.md,
               management/METRICS.md y el informe más reciente de management/audit-reports/.
            2. Revisa con WebFetch la portada y como máximo 3 páginas más de https://domiwebb.com
               (prioriza las relacionadas con tareas abiertas del backlog).
            3. Escribe management/audit-reports/${{ steps.guarda.outputs.fecha }}-auditoria-semanal.md con:
               estado general, qué cambió desde el informe anterior, avance de cada tarea abierta,
               hallazgos nuevos priorizados P0–P3 con evidencia, y las 3 acciones recomendadas para la semana.
            4. Actualiza solo la columna Estado de las tareas existentes en management/IMPROVEMENT_BACKLOG.md
               y añade tareas nuevas DW-### si hay hallazgos con evidencia.
            Reglas: no modifiques ningún otro archivo. No inventes datos, cifras, clientes ni precios;
            lo que no puedas comprobar se marca PENDIENTE DE VALIDACIÓN. Sin datos de GA4 o Search Console
            en el repositorio, dilo como limitación en lugar de suponer.

      # La verificación y la publicación no ejecutan git dentro del área de trabajo del agente
      # (podría haber dejado configuración o hooks): se compara contra un clon limpio.
      - name: Verificar que solo cambió management/
        id: cambios
        if: steps.guarda.outputs.seguir == 'true'
        run: |
          limpio="$RUNNER_TEMP/limpio"
          git -c core.hooksPath=/dev/null clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$limpio"
          diff -rq --exclude=.git "$limpio" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/diff.txt" || true
          : > "$RUNNER_TEMP/permitidos.txt"; fuera=""
          while read -r linea; do
            case "$linea" in
              "Files $limpio/"*" and $GITHUB_WORKSPACE/"*" differ") f=${linea#Files $limpio/}; f=${f%% and *} ;;
              "Only in $GITHUB_WORKSPACE/"*) d=${linea#Only in $GITHUB_WORKSPACE/}; f="${d%%: *}/${d#*: }" ;;
              "Only in $GITHUB_WORKSPACE: "*) f=${linea#Only in $GITHUB_WORKSPACE: } ;;
              *) fuera="$fuera\n$linea"; continue ;;
            esac
            if [[ "$f" =~ ^management/audit-reports/[^/]+\.md$ || "$f" == "management/IMPROVEMENT_BACKLOG.md" ]]; then
              echo "$f" >> "$RUNNER_TEMP/permitidos.txt"
            else
              fuera="$fuera\n$f"
            fi
          done < "$RUNNER_TEMP/diff.txt"
          if [ -n "$fuera" ]; then
            echo "Cambios fuera de lo permitido; no se publica nada:" | tee -a "$GITHUB_STEP_SUMMARY"
            echo -e "$fuera" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          while read -r f; do
            if grep -qE 'sk-ant-|ghs_|gh[pousr]_[A-Za-z0-9]{20,}' "$GITHUB_WORKSPACE/$f"; then
              echo "Posible credencial en $f; no se publica nada." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
            fi
          done < "$RUNNER_TEMP/permitidos.txt"
          if [ -s "$RUNNER_TEMP/permitidos.txt" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "La auditoría no produjo cambios." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "hay=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir PR con el informe
        if: steps.cambios.outputs.hay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FECHA: ${{ steps.guarda.outputs.fecha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rama="auditoria/${FECHA}-${GITHUB_RUN_ID}"
          limpio="$RUNNER_TEMP/limpio"
          while read -r f; do
            mkdir -p "$limpio/$(dirname "$f")"; cp "$GITHUB_WORKSPACE/$f" "$limpio/$f"
          done < "$RUNNER_TEMP/permitidos.txt"
          cd "$limpio"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$rama"
          git add management/
          git -c core.hooksPath=/dev/null commit --no-verify -m "Auditoría semanal ${FECHA} (automática)"
          git -c core.hooksPath=/dev/null push --no-verify \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$rama"
          cuerpo="Informe semanal generado por la auditoría con IA (modelo ${MODELO}). Ejecución: ${RUN_URL}. Revisar antes de fusionar: solo cambia management/."
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$rama" --title "Auditoría semanal ${FECHA}" --body "$cuerpo" \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "Auditoría semanal ${FECHA} lista en la rama ${rama}" --body "$cuerpo (No se pudo abrir el PR: activa 'Allow GitHub Actions to create and approve pull requests' en Settings → Actions → General.)"

      - name: Avisar si la auditoría falló
        if: failure() && steps.guarda.outputs.seguir == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create alerta-auditoria --color D93F0B --description "Fallo de la auditoría semanal con IA" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Auditoría semanal con IA falló ($(date -u +%F))" --label alerta-auditoria --body "Revisa la ejecución: ${RUN_URL}"
